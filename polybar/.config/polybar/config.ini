[colors]
background = #cc282a2e
background-alt = #373b41
foreground = #c5c8c6
primary = #81a1c1
secondary = #8abeb7
alert = #cc6666
disabled = #707880

[bar/mintbar]
; Bottom = true: bar on the bottom, bottom = false: bar on the top
bottom = false
monitor = ${env:MONITOR:}
width = 100%
height = 15pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = i3 xwindow tray
modules-center = date 
modules-right = pulseaudio btop control-center software-manager my-battery
; pulseaudio control-center
; modules-right = pulseaudio btop mouse-settings control-center my-battery software-manager
; display-settings 
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3

; Only show workspaces on the current output & keep things tidy
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

; --- TOGGLEABLE SYMBOLS / ICONS CONFIGURATION ---
; Customize these to match your preferred symbols/icons for each workspace
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;

; --- FORMAT & MODES ---
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.alert}

; --- XFWM4 STYLE LABELS (Shows Icon + Workspace/App Name) ---

; Focused workspace/app tab
label-focused = "%icon% %name%"
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

; Unfocused (background) workspace tabs
label-unfocused = "%icon% %name%"
label-unfocused-background = ${colors.background}
label-unfocused-padding = 2

; Visible on other monitors
label-visible = "%icon% %name%"
label-visible-padding = 2

; Urgent window/workspace (flashes or highlights like xfwm4)
label-urgent = "%icon% %name%"
label-urgent-background = ${colors.alert}
label-urgent-padding = 2


[module/xwindow]
type = internal/xwindow
; Makes the active window name small and clean, stripping long browser suffixes
label = %title%
label-maxlen = 30
label-empty = Desktop
label-foreground = ${colors.primary}


[module/pulseaudio]
type = internal/pulseaudio


format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

; Click left to open pavucontrol (advanced audio settings panel)
click-right = pavucontrol

[module/mouse-settings]
type = custom/text
format = 󰍽 Mouse
format-foreground = ${colors.primary}
click-left = lxappearance


[module/software-manager]
type = custom/text 
format = 󰙵 Software manager
format-foreground = ${colors.primary}
click-left = mintinstall


[module/display-settings]
type = custom/text
format = 󰍹 Display
format-foreground = ${colors.primary}
click-left = xfce4-display-settings

[module/my-battery]
type = internal/battery

; Use the system path name you found earlier (e.g., BAT0 or BAT1)
battery = BAT0
adapter = ACAD
full-at = 99


format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 🔋 <label-full>

label-charging = "Charging: %percentage%%"
label-discharging = "Battery: %percentage%%"
label-full = "Fully Charged"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/control-center]
type = custom/text
format = 󰒓 Control Center
format-foreground = ${colors.secondary}
click-left = xfce4-settings-manager

[module/file-manager]
type = custom/text
format =  File manager
format-foreground = ${colors.secondary}
click-left = thunar

[module/btop]
type = custom/text
format = Background Processes
format-foreground = ${colors.secondary}
click-left = xfce4-terminal -e btop
; Use -e if you want to run a command while opening xfce4-terminal (-e = -execute, just shortname of it)

[module/tray]
type = internal/tray
tray-spacing = 6px
tray-size = 16pt

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M

; Wrap your label format with the action tag (1 represents left-click)
label = %{A1:gnome-calendar:}%date%%{A}
label-foreground = ${colors.primary}

[module/applications]
type = custom/text
format = 󰣆 Applications
format-foreground = ${colors.primary}
click-left = xfce4-appfinder

[settings]
screenchange-reload = true
pseudo-transparency = true
