# ==============================================================================
# Backend & General Settings
# ==============================================================================

backend = "xrender";
vsync = true;

# Uncomment if you experience tearing or performance issues with xrender
# glx-no-stencil = true;
# unredir-if-possible = false;


# ==============================================================================
# Shadows
# ==============================================================================

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.75;

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];


# ==============================================================================
# Fading
# ==============================================================================

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

fade-exclude = [];


# ==============================================================================
# Transparency & Opacity
# ==============================================================================

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Cairo-clock'"
];


# ==============================================================================
# Corners
# ==============================================================================

corner-radius = 10;
detect-rounded-corners = true;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ==============================================================================
# Blur
# ==============================================================================

blur-method = "none";
blur-strength = 5;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];


# ==============================================================================
# Window Type Settings
# ==============================================================================

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.90; };
    dropdown_menu = { opacity = 0.90; };
};
