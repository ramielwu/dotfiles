# Animations

# Fading windows during opacity changes (smooth open/close feel)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Transparency / Opacity

# Inactive window transparency (0.0 - 1.0, 1.0 = opaque)
inactive-opacity = 1.0;

# Active window opacity 
active-opacity = 1.0;

# Opacity of window titlebars and borders (0.0 - 1.0)
frame-opacity = 1.0;

# Let inactive opacity set by -i override the *_opacity values of windows
inactive-opacity-override = false;

# Dim inactive windows to give a focus effect (0.0 - 1.0, set to 0.0 to disable)
inactive-dim = 0.05;

# Specific rule overrides for clean terminal/app transparency
opacity-rule = [
    "100:class_g = 'URxvt'",
    "100:class_g = 'Alacritty' && focused",
    "90:class_g = 'Alacritty' && !focused",
    "100:class_g = 'Polybar'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'firefox'"
];

# -- Rounded corners --

# Radius of window corners (Set to 0 to disable)
corner-radius = 10;

# Exclude conditions for rounded corners
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'dwm'"
];

# -- Shadows --

# Enabled client-side shadows on windows
shadow = false;

# The blur radius for shadows, in pixels
shadow-radius = 12;

# The opacity for shadows (0.0 - 1.0)
shadow-opacity = 0.75;

# The left offset for shadows, in pixels
shadow-offset-x = -12;

# The top offset for shadows, in pixels
shadow-offset-y = -12;

# Exclude conditions for shadows
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c"
];

# -- Background blur --

# Parameters for background blurring (Requires a compositor fork with Kawase or dual-kawase for best speed)
blur-method = "dual_kawase";
blur-size = 10;
blur-deviation = false;
blur-strength = 3;

# Exclude conditions for background blur
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# -- General settings --

# Refresh rate
#refresh-rate = 60

# Daemonize process, fork to background (Equivalent to picom -b)
daemon = false;

# Specify the backend to use: 'xrender', 'glx', or 'egl'. 
# 'glx' is fast and ideal for modern cards. Use 'xrender' if you experience lag on legacy drivers.
# options: glx, egl, xrender, xr_glx_hybrid
backend = "xrender";

# Use damage
use-damage = true;

# Use VSync to eliminate screen tearing
vsync = true;

# Enable remote DBus control (allows external scripts to toggle settings)
dbus = false;

# Try to detect windows with rounded corners and don't consider them shaped windows
detect-rounded-corners = true;

# Detect _NET_WM_WINDOW_OPACITY on client windows (helpful for transparent bars/terminals)
detect-client-opacity = true;

# Use EWMH _NET_WM_ACTIVE_WINDOW to determine which window is focused
use-ewmh-active-win = true;

# Redirect root window to a buffer instead of drawing directly to screen (improves tearing handling)
unredir-if-possible = true;

# Log level ('debug', 'info', 'warn', 'error')
log-level = "warn";

# GLX backend optimization settings
use-damage = true;       # Drastically reduces CPU usage; set to false if you see visual glitch lines
xrender-sync-fence = false;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
