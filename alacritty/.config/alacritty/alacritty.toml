# Other

# =========================================================================
# ALACRITTY CONFIGURATION FILE (Tango Palette & Custom Font)
# =========================================================================

# --- WINDOW CONFIGURATION ---
[window]
dimensions = { columns = 120, lines = 34 }
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "full"
opacity = 0.70
startup_mode = "Windowed"

# --- FONT CONFIGURATION ---
[font]
size = 11

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "ExtraBold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "ExtraBold Italic"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Heavy Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

# --- CURSOR CONFIGURATION ---
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 300




# --- COLOR SCHEME: TANGO PALETTE ---
[colors.primary]
background = "#ffffff"
foreground = "#2e3436"

[colors.normal]
black   = "#2e3436"
red     = "#cc0000"
green   = "#4e9a06"
yellow  = "#c4a000"
blue    = "#3465a4"
magenta = "#75507b"
cyan    = "#06989a"
white   = "#d3d7cf"

[colors.bright]
black   = "#555753"
red     = "#ef2929"
green   = "#8ae234"
yellow  = "#fce94f"
blue    = "#729fcf"
magenta = "#ad7fa8"
cyan    = "#34e2e2"
white   = "#ffffff"


# --- KEYBOARD CONFIGURATION ---
[keyboard]
# Ensures standard key processing behavior
bindings = []
